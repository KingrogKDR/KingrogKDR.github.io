<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;

        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .menu-toggle {
        display: none;
        background: none;
        border: 1px solid var(--faint);
        border-radius: 4px;
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
        width: 36px;
        height: 36px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .menu-toggle:hover {
        border-color: var(--muted);
      }

      @media (max-width: 640px) {
        .menu-toggle {
          display: flex;
        }
        .nav-inner {
          padding: 0 20px;
          gap: 12px;
        }
        .nav-links {
          display: none;
          flex-direction: column;
          gap: 0;
          position: absolute;
          top: 56px;
          left: 0;
          right: 0;
          background: var(--nav-bg);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--faint);
          padding: 8px 0 16px;
          list-style: none;
        }
        .nav-links.open {
          display: flex;
        }
        .nav-links li a {
          display: block;
          padding: 12px 20px;
          font-size: 15px;
          border-bottom: 1px solid var(--faint);
        }
        .nav-links li:last-child a {
          border-bottom: none;
        }
        .nav-right {
          gap: 10px;
        }
        .page {
          padding: 96px 16px 64px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo" id="nav-name">Abhishek Saikia</a>
        <div class="nav-right">
          <ul class="nav-links" id="nav-links">
            <li><a href="writing.html">Writing</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-toggle-thumb"></span>
          </button>
        </div>
      </div>
    </nav>

    <div class="page">
      <p class="section-label fade-in d1">Get in touch</p>
      <h1 class="section-title fade-in d2">Contact & Links</h1>

      <p class="contact-intro fade-in d3">
        The best way to reach me is by email. I'm also around on the internet in
        a few places — links below.
      </p>

      <ul class="links-list fade-in d3" id="links-list">
        <p class="loading">Loading…</p>
      </ul>
    </div>

    <footer>
      <p id="footer-name">© 2025 Your Name · Made with care</p>
    </footer>

    <script>
      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());
        document.title = `Contact — ${cv.name}`;
        document.getElementById("nav-name").textContent = cv.name;
        document.getElementById("footer-name").textContent =
          `© ${new Date().getFullYear()} ${cv.name} · Made with care`;

        const { email, twitter, linkedin, github } = cv.contact;

        const links = [
          email && {
            icon: "✉️",
            label: "Email",
            handle: email,
            href: `mailto:${email}`,
          },
          twitter && {
            icon: "𝕏",
            label: "Twitter / X",
            handle: twitter,
            href: `https://twitter.com/${twitter.replace("@", "")}`,
          },
          linkedin && {
            icon: "💼",
            label: "LinkedIn",
            handle: linkedin,
            href: `https://linkedin.com/in/${linkedin}`,
          },
          github && {
            icon: "🐙",
            label: "GitHub",
            handle: github,
            href: `https://github.com/${github}`,
          },
        ].filter(Boolean);

        document.getElementById("links-list").innerHTML = links
          .map(
            (l) => `
        <li>
          <a href="${l.href}" ${l.href.startsWith("http") ? 'target="_blank"' : ""}>
            <span class="link-label">
              <span class="link-icon">${l.icon}</span>
              ${l.label}
            </span>
            <span style="display:flex;gap:12px;align-items:center;">
              <span class="link-handle">${l.handle}</span>
              <span class="link-arrow">↗</span>
            </span>
          </a>
        </li>
      `,
          )
          .join("");
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
