      rel="apple-touch-icon"

    <!-- Theme flash prevention: dark is the default working theme, light is opt-in and remembered -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        document.documentElement.setAttribute(
          "data-theme",
          saved === "light" ? "light" : "dark",
        );
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <div class="nav-left">
          <span class="window-dots"
            ><span></span><span></span><span></span
          ></span>
          <a href="index.html" class="nav-logo" id="nav-name"
            >abhishek-saikia</a
          >
        </div>
        <div class="nav-right">
          <ul class="nav-links" id="nav-links">
            <li><a href="writing.html">writing</a></li>
            <li><a href="projects.html">projects</a></li>
            <li><a href="contact.html">contact</a></li>
          </ul>
          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-toggle-thumb"></span>
          </button>
        </div>
      </div>
    </nav>

    <main>
      <div class="page">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <div class="content-col">
          <section class="pane fade-in d1" aria-label="Contact">
            <div class="pane-tab">contact.md</div>
            <div class="pane-body">
              <p class="comment-label">get in touch</p>
              <p class="page-intro" style="margin-bottom: 28px">
                The best way to reach me is by email. I'm also around on the
                internet in a few places — links below.
              </p>

              <ul class="links-list" id="links-list">
                <li><p class="loading">Loading…</p></li>
              </ul>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p id="footer-name">2026 Abhishek Saikia — Thanks for visiting!</p>
    </footer>

    <script src="seo.js"></script>
    <script src="common.js"></script>
    <script>
      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());

        window.SEO.setPage({
          title: "Contact",
          description: `Get in touch with ${cv.name} — email and links.`,
          url: window.SEO.BASE_URL + "/contact.html",
          type: "website",
          breadcrumbs: [
            { name: "Home", url: window.SEO.BASE_URL + "/" },
            { name: "Contact", url: window.SEO.BASE_URL + "/contact.html" },
          ],
        });

        document.getElementById("nav-name").textContent = cv.name
          .toLowerCase()
          .replace(/\s+/g, "-");
        document.getElementById("footer-name").textContent =
          `${new Date().getFullYear()} ${cv.name} — Thanks for visiting!`;

        const { email, twitter, linkedin, github } = cv.contact;

        const links = [
          email && {
            icon: "mail",
            label: "Email",
            handle: email,
            href: `mailto:${email}`,
          },
          twitter && {
            icon: "x",
            label: "Twitter / X",
            handle: twitter,
            href: `https://twitter.com/${twitter.replace("@", "")}`,
          },
          linkedin && {
            icon: "in",
            label: "LinkedIn",
            handle: linkedin,
            href: `https://linkedin.com/in/${linkedin}`,
          },
          github && {
            icon: "gh",
            label: "GitHub",
            handle: github,
            href: `https://github.com/${github}`,
          },
        ].filter(Boolean);

        document.getElementById("links-list").innerHTML = links
          .map(
            (l) => `
        <li>
          <a href="${l.href}" ${l.href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
            <span class="link-label">
              <span class="link-icon">${l.icon}</span>
              ${l.label}
            </span>
            <span style="display:flex;gap:12px;align-items:center;">
              <span class="link-handle">${escHTML(l.handle)}</span>
              <span class="link-arrow">↗</span>
            </span>
          </a>
        </li>
      `,
          )
          .join("");

        paintGutter();
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
