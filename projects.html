<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — Abhishek Saikia</title>
    <meta
      name="description"
      content="Selected work and projects by Abhishek Saikia."
    />
    <link rel="canonical" href="https://kingrogkdr.github.io/projects.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Projects — Abhishek Saikia" />
    <meta
      property="og:description"
      content="Selected work and projects by Abhishek Saikia."
    />
    <meta
      property="og:url"
      content="https://kingrogkdr.github.io/projects.html"
    />
    <meta
      property="og:image"
      content="https://kingrogkdr.github.io/images/og-default.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link rel="icon" href="images/favicon/favicon.ico" />

    <!-- Theme flash prevention: dark is the default working theme, light is opt-in and remembered -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        document.documentElement.setAttribute(
          "data-theme",
          saved === "light" ? "light" : "dark",
        );
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav></nav>

    <main>
      <div class="page-wide">
        <p class="comment-label fade-in d1">selected work</p>
        <h1
          class="hero-name fade-in d2"
          style="font-size: clamp(26px, 4vw, 36px); margin-bottom: 28px"
        >
          Projects
        </h1>

        <div class="projects-grid fade-in d3" id="projects-grid">
          <p class="loading">Loading…</p>
        </div>
      </div>
    </main>

    <footer>
      <p id="footer-name">2026 Abhishek Saikia — Thanks for visiting!</p>
    </footer>

    <script src="seo.js"></script>
    <script src="common.js"></script>
    <script>
      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());

        window.SEO.setPage({
          title: "Projects",
          description: `Selected work and projects by ${cv.name}.`,
          url: window.SEO.BASE_URL + "/projects.html",
          type: "website",
          breadcrumbs: [
            { name: "Home", url: window.SEO.BASE_URL + "/" },
            { name: "Projects", url: window.SEO.BASE_URL + "/projects.html" },
          ],
        });

        document.getElementById("footer-name").textContent =
          `${new Date().getFullYear()} ${cv.name} — Thanks for visiting!`;

        const grid = document.getElementById("projects-grid");
        grid.innerHTML = cv.projects
          .map(
            (p) => `
        <a href="${p.url}" class="project-card" ${p.url !== "#" ? 'target="_blank" rel="noopener"' : ""}>
          <img src="${p.icon}" class="project-icon" alt="" />
          <div class="project-name">${escHTML(p.name)}</div>
          <div class="project-desc">${escHTML(p.description)}</div>
          <div class="project-meta">
            ${p.tags.map((t) => `<span class="tag">${escHTML(t)}</span>`).join("")}
          </div>
        </a>
      `,
          )
          .join("");
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
