<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Series — Abhishek Saikia</title>
    <meta name="description" content="" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link rel="icon" href="images/favicon/favicon.ico" />
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .menu-toggle {
        display: none;
        background: none;
        border: 1px solid var(--faint);
        border-radius: 4px;
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
        width: 36px;
        height: 36px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .menu-toggle:hover {
        border-color: var(--muted);
      }
      @media (max-width: 640px) {
        .menu-toggle {
          display: flex;
        }
        .nav-inner {
          padding: 0 20px;
          gap: 12px;
        }
        .nav-links {
          display: none;
          flex-direction: column;
          gap: 0;
          position: absolute;
          top: 56px;
          left: 0;
          right: 0;
          background: var(--nav-bg);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--faint);
          padding: 8px 0 16px;
          list-style: none;
        }
        .nav-links.open {
          display: flex;
        }
        .nav-links li a {
          display: block;
          padding: 12px 20px;
          font-size: 15px;
          border-bottom: 1px solid var(--faint);
        }
        .nav-links li:last-child a {
          border-bottom: none;
        }
        .nav-right {
          gap: 10px;
        }
        .page {
          padding: 96px 16px 64px;
        }
      }
      .series-header {
        margin-bottom: 48px;
      }
      .series-meta-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .series-eyebrow {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .series-count-badge {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: color-mix(in srgb, var(--ink) 6%, transparent);
        padding: 3px 9px;
        border-radius: 99px;
        border: 1px solid var(--faint);
      }
      .series-title-h1 {
        font-size: clamp(26px, 5vw, 36px);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--ink);
        margin: 0 0 14px;
      }
      .series-description {
        font-size: 15px;
        color: var(--muted);
        line-height: 1.75;
        max-width: 580px;
        margin: 0;
      }
      .series-divider {
        border: none;
        border-top: 1px solid var(--faint);
        margin: 0 0 36px;
      }
      .series-posts {
        display: flex;
        flex-direction: column;
        gap: 0;
        position: relative;
      }
      .series-posts::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 28px;
        bottom: 28px;
        width: 1px;
        background: var(--faint);
      }
      .series-post-item {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        padding: 20px 0;
        text-decoration: none;
        color: inherit;
        transition: opacity 0.15s;
        position: relative;
      }
      .series-post-item:hover {
        opacity: 0.78;
      }
      .series-post-item + .series-post-item {
        border-top: 1px solid var(--faint);
      }
      .series-part-marker {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1.5px solid var(--faint);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.02em;
        position: relative;
        z-index: 1;
        transition:
          border-color 0.2s,
          color 0.2s,
          background 0.2s;
      }
      .series-post-item:hover .series-part-marker {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, var(--bg));
      }
      .series-post-body {
        flex: 1;
        padding-top: 5px;
      }
      .series-post-part-label {
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .series-post-title {
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
        line-height: 1.35;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .series-post-excerpt {
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.65;
        margin: 0 0 8px;
      }
      .series-post-date {
        font-size: 12px;
        color: var(--muted);
        opacity: 0.7;
      }
      .series-post-item.coming-soon {
        pointer-events: none;
        opacity: 0.4;
      }
      .coming-soon-chip {
        display: inline-block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px dashed var(--faint);
        padding: 2px 8px;
        border-radius: 99px;
        margin-left: 8px;
        vertical-align: middle;
      }
      .series-back {
        display: inline-block;
        margin-top: 48px;
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.15s;
      }
      .series-back:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo" id="nav-name">Abhishek Saikia</a>
        <div class="nav-right">
          <ul class="nav-links" id="nav-links">
            <li><a href="writing.html">Writing</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-toggle-thumb"></span>
          </button>
        </div>
      </div>
    </nav>

    <main>
      <div class="page">
        <a href="writing.html" class="back-link fade-in d1">← All writing</a>
        <div id="series-container">
          <p class="loading">Loading…</p>
        </div>
      </div>
    </main>

    <footer>
      <p id="footer-name">© 2026 Abhishek Saikia · Made with care</p>
    </footer>

    <script src="seo.js"></script>
    <script>
      function escHTML(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function formatDate(iso) {
        return new Date(iso).toLocaleDateString("en", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());
        document.getElementById("nav-name").textContent = cv.name;
        document.getElementById("footer-name").textContent =
          `© ${new Date().getFullYear()} ${cv.name} · Made with care`;

        const id = new URLSearchParams(window.location.search).get("id");
        if (!id) {
          document.getElementById("series-container").innerHTML =
            "<p>Series not found.</p>";
          return;
        }

        const allSeries = await fetch("blogs/series.json").then((r) =>
          r.json(),
        );
        const series = allSeries.find((s) => s.id === id);
        if (!series) {
          document.getElementById("series-container").innerHTML =
            "<p>Series not found.</p>";
          return;
        }

        const canonicalUrl = `${window.SEO.BASE_URL}/series.html?id=${encodeURIComponent(id)}`;
        window.SEO.setPage({
          title: `${series.title} — Series`,
          description: series.description,
          url: canonicalUrl,
          type: "website",
          breadcrumbs: [
            { name: "Home", url: window.SEO.BASE_URL + "/" },
            { name: "Writing", url: window.SEO.BASE_URL + "/writing.html" },
            { name: series.title, url: canonicalUrl },
          ],
        });

        const posts = await Promise.all(
          series.posts.map((slug) =>
            fetch(`blogs/${encodeURIComponent(slug)}.json`)
              .then((r) => (r.ok ? r.json() : null))
              .catch(() => null),
          ),
        );
        const totalParts = series.posts.length;
        const loadedCount = posts.filter(Boolean).length;

        const postsHTML = posts
          .map((post, i) => {
            const partNum = i + 1;
            if (!post) {
              return `<div class="series-post-item coming-soon">
              <div class="series-part-marker">${partNum}</div>
              <div class="series-post-body">
                <p class="series-post-part-label">Part ${partNum} of ${totalParts}</p>
                <h2 class="series-post-title">Coming soon <span class="coming-soon-chip">Soon</span></h2>
              </div>
            </div>`;
            }
            return `<a href="post.html?slug=${encodeURIComponent(post.slug)}" class="series-post-item">
            <div class="series-part-marker">${partNum}</div>
            <div class="series-post-body">
              <p class="series-post-part-label">Part ${partNum} of ${totalParts}</p>
              <h2 class="series-post-title">${escHTML(post.title)}</h2>
              <p class="series-post-excerpt">${escHTML(post.excerpt)}</p>
              <time class="series-post-date" datetime="${post.date}">${formatDate(post.date)}</time>
            </div>
          </a>`;
          })
          .join("");

        document.getElementById("series-container").innerHTML = `
          <div class="series-header fade-in d2" itemscope itemtype="https://schema.org/CreativeWorkSeries">
            <div class="series-meta-row">
              <span class="series-eyebrow">Series</span>
              <span class="series-count-badge">${loadedCount} of ${totalParts} published</span>
            </div>
            <h1 class="series-title-h1" itemprop="name">${escHTML(series.title)}</h1>
            <p class="series-description" itemprop="description">${escHTML(series.description)}</p>
          </div>
          <hr class="series-divider fade-in d3">
          <div class="series-posts fade-in d3" role="list">${postsHTML}</div>
          <a href="writing.html" class="series-back fade-in d4">← Back to all writing</a>`;
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
