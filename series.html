<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Series — Abhishek Saikia</title>
    <meta name="description" content="" />
    <!-- canonical and OG tags filled by seo.js at runtime -->
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link rel="icon" href="images/favicon/favicon.ico" />

    <!-- Theme flash prevention: dark is the default working theme, light is opt-in and remembered -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        document.documentElement.setAttribute(
          "data-theme",
          saved === "light" ? "light" : "dark",
        );
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav></nav>

    <!-- Share toast notification -->
    <div class="share-toast" id="share-toast" role="status" aria-live="polite">
      <svg viewBox="0 0 14 14"><polyline points="2 7 5.5 10.5 12 4" /></svg>
      Link copied
    </div>

    <main>
      <div class="page-wide">
        <a href="writing.html" class="back-link fade-in d1">← all writing</a>
        <div id="series-container">
          <p class="loading">Loading…</p>
        </div>
      </div>
    </main>

    <footer>
      <p id="footer-name">2026 Abhishek Saikia — Thanks for visiting!</p>
    </footer>

    <script src="seo.js"></script>
    <script src="common.js"></script>
    <script>
      const SHARE_ICON = `<svg viewBox="0 0 14 14"><circle cx="11" cy="2.5" r="1.5"/><circle cx="11" cy="11.5" r="1.5"/><circle cx="3" cy="7" r="1.5"/><line x1="4.4" y1="7.7" x2="9.7" y2="10.9"/><line x1="9.7" y1="3.1" x2="4.4" y2="6.3"/></svg>`;

      // escHTML comes from common.js. formatDateLong here is intentionally
      // a full written-out date (common.js's formatDate() returns a short
      // {mon, year} pair meant for list views) — same pattern post.html uses.
      function formatDateLong(iso) {
        return new Date(iso).toLocaleDateString("en", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      /* ── Share ── */
      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById("share-toast");
        toast.childNodes[2].textContent = " " + msg;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2400);
      }

      async function shareItem(url, title, text) {
        if (navigator.share) {
          try {
            await navigator.share({ title, text, url });
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }
        try {
          await navigator.clipboard.writeText(url);
          showToast("Link copied");
        } catch {
          const inp = document.createElement("input");
          inp.value = url;
          document.body.appendChild(inp);
          inp.select();
          document.execCommand("copy");
          document.body.removeChild(inp);
          showToast("Link copied");
        }
      }

      // Renders one timeline entry — a link for a published post, a
      // non-interactive "Coming soon" div for a slug with no post yet.
      // Styling comes entirely from .series-timeline-item(.unavailable)
      // etc. in style.css.
      function buildTimelineItem(post, slug, partNum, totalParts) {
        if (!post) {
          return `<div class="series-timeline-item unavailable">
            <div class="series-timeline-badge">${partNum}</div>
            <div>
              <p class="series-timeline-part-label">Part ${partNum} of ${totalParts}</p>
              <h2 class="series-timeline-title">Coming soon</h2>
            </div>
          </div>`;
        }
        return `<a href="post.html?slug=${encodeURIComponent(slug)}" class="series-timeline-item">
          <div class="series-timeline-badge">${partNum}</div>
          <div>
            <p class="series-timeline-part-label">Part ${partNum} of ${totalParts}</p>
            <h2 class="series-timeline-title">${escHTML(post.title)}</h2>
            <p class="series-timeline-excerpt">${escHTML(post.excerpt)}</p>
            <time class="series-timeline-date" datetime="${post.date}">${formatDateLong(post.date)}</time>
          </div>
        </a>`;
      }

      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());
        document.getElementById("footer-name").textContent =
          `${new Date().getFullYear()} ${cv.name} — Thanks for visiting!`;

        const id = new URLSearchParams(window.location.search).get("id");
        if (!id) {
          document.getElementById("series-container").innerHTML =
            "<p>Series not found.</p>";
          return;
        }

        const allSeries = await fetch("blogs/series.json").then((r) =>
          r.json(),
        );
        const series = allSeries.find((s) => s.id === id);
        if (!series) {
          document.getElementById("series-container").innerHTML =
            "<p>Series not found.</p>";
          return;
        }

        const canonicalUrl = `${window.SEO.BASE_URL}/series/${encodeURIComponent(id)}.html`;

        // "og-image" on the series object is the share-card image for the series page.
        const ogImage = series["og-image"]
          ? series["og-image"].startsWith("http")
            ? series["og-image"]
            : `${window.SEO.BASE_URL}/${series["og-image"]}`
          : window.SEO.DEFAULT_IMAGE;

        window.SEO.setPage({
          title: `${series.title} — Series`,
          description: series.description,
          url: canonicalUrl,
          type: "website",
          image: ogImage,
          breadcrumbs: [
            { name: "Home", url: window.SEO.BASE_URL + "/" },
            { name: "Blogs", url: window.SEO.BASE_URL + "/writing.html" },
            { name: series.title, url: canonicalUrl },
          ],
        });

        // Posts are plain Markdown files (frontmatter + body), same as
        // post.html and writing.html. Missing/unparseable posts resolve
        // to null and render as "Coming soon" via buildTimelineItem().
        const posts = await Promise.all(
          series.posts.map((slug) =>
            fetch(`blogs/${encodeURIComponent(slug)}.md`)
              .then((r) => (r.ok ? r.text() : null))
              .then((raw) => (raw ? parsePostFile(raw).meta : null))
              .catch(() => null),
          ),
        );
        const totalParts = series.posts.length;
        const loadedCount = posts.filter(Boolean).length;

        const timelineHTML = posts
          .map((post, i) =>
            buildTimelineItem(post, series.posts[i], i + 1, totalParts),
          )
          .join("");

        document.getElementById("series-container").innerHTML = `
          <div class="fade-in d2" itemscope itemtype="https://schema.org/CreativeWorkSeries">
            <div class="series-page-eyebrow">
              <span class="series-label-chip">series</span>
              <span class="series-page-count">${loadedCount} of ${totalParts} published</span>
            </div>
            <h1 class="series-page-title" itemprop="name">${escHTML(series.title)}</h1>
            <p class="series-page-desc" itemprop="description">${escHTML(series.description)}</p>
            <button class="share-btn" id="share-btn" aria-label="Share this series">${SHARE_ICON} share series</button>
          </div>
          <div class="series-timeline fade-in d3" role="list">${timelineHTML}</div>
          <a href="writing.html" class="back-link fade-in d4">← back to all writing</a>`;

        document.getElementById("share-btn").addEventListener("click", () => {
          shareItem(canonicalUrl, series.title, series.description || "");
        });
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
