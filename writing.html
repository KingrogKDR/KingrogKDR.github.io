    <script src="seo.js"></script>
    <script>
      const BLOGS = [
        "on-slowness-as-a-creative-practice",
        "attention-is-infrastructure",
        "why-a-custom-kube-scheduler",
        // add more slugs here
      ];

      let ALL_POSTS = [];
      let ALL_SERIES = [];
      let activeTagFilter = null;

      const PIN_SVG = `<svg viewBox="0 0 10 10" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 1L9 3.5 6 6.5 5 9 4 6.5 1 3.5 3.5 1z"/></svg>`;
      const ARROW_SVG = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8M6 2l4 4-4 4"/></svg>`;

      function escHTML(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function normaliseTags(raw) {
        return !raw ? [] : Array.isArray(raw) ? raw : [raw];
      }
      function formatDate(iso) {
        const d = new Date(iso);
        return {
          mon: d.toLocaleString("en", { month: "short" }),
          year: d.getFullYear(),
        };
      }
      function escapeRe(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      function highlight(text, term) {
        if (!term) return text;
        return text.replace(
          new RegExp(`(${escapeRe(term)})`, "gi"),
          '<mark class="search-highlight">$1</mark>',
        );
      }
      function parseQuery(raw) {
        const q = raw.trim();
        const result = { tag: null, slug: null, phrase: null, text: "" };
        let remaining = q;
        const tagMatch = remaining.match(/\btag:(\S+)/i);
        if (tagMatch) {
          result.tag = tagMatch[1].toLowerCase();
          remaining = remaining.replace(tagMatch[0], "").trim();
        }
        const inMatch = remaining.match(/\bin:(\S+)/i);
        if (inMatch) {
          result.slug = inMatch[1].toLowerCase();
          remaining = remaining.replace(inMatch[0], "").trim();
        }
        const phraseMatch = remaining.match(/"([^"]+)"/);
        if (phraseMatch) {
          result.phrase = phraseMatch[1].toLowerCase();
          remaining = remaining.replace(phraseMatch[0], "").trim();
        }
        result.text = remaining.toLowerCase();
        return result;
      }
      function matchPost(post, filters, pillTag) {
        const tags = normaliseTags(post.tag).map((t) => t.toLowerCase());
        const title = post.title.toLowerCase();
        const slug = (post.slug || "").toLowerCase();
        const isPinned = !!post.pinned;
        if (pillTag) {
          if (pillTag === "pinned" ? !isPinned : !tags.includes(pillTag))
            return false;
        }
        if (filters.tag) {
          if (
            filters.tag === "pinned"
              ? !isPinned
              : !tags.some((t) => t.includes(filters.tag))
          )
            return false;
        }
        if (filters.slug && !slug.includes(filters.slug)) return false;
        if (filters.phrase && !title.includes(filters.phrase)) return false;
        if (filters.text && !title.includes(filters.text)) return false;
        return true;
      }
      function sortPosts(posts, order) {
        return [...posts].sort((a, b) => {
          if (order === "newest") {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return new Date(b.date) - new Date(a.date);
          }
          if (order === "oldest") return new Date(a.date) - new Date(b.date);
          if (order === "az") return a.title.localeCompare(b.title);
          if (order === "za") return b.title.localeCompare(a.title);
          return 0;
        });
      }
      function renderSeriesCards(isSearching) {
        const container = document.getElementById("series-section");
        if (isSearching || ALL_SERIES.length === 0) {
          container.innerHTML = "";
          return;
        }
        const cardsHTML = ALL_SERIES.map((series) => {
          const seriesPosts = series.posts
            .map((slug) => ALL_POSTS.find((p) => p.slug === slug))
            .filter(Boolean);
          if (seriesPosts.length === 0) return "";
          const totalDefined = series.posts.length;
          const publishedCount = seriesPosts.length;
          const previewItems = seriesPosts
            .slice(0, 3)
            .map(
              (p, i) =>
                `<div class="series-preview-post"><span class="series-preview-num">${i + 1}.</span><span class="series-preview-title">${escHTML(p.title)}</span></div>`,
            )
            .join("");
          const moreCount = seriesPosts.length - 3;
          const moreNote =
            moreCount > 0
              ? `<div class="series-preview-post"><span class="series-preview-num"></span><span style="font-size:12px;color:var(--muted);opacity:0.6">+${moreCount} more</span></div>`
              : "";
          const countLabel =
            totalDefined > publishedCount
              ? `${publishedCount} of ${totalDefined} published`
              : `${publishedCount} ${publishedCount === 1 ? "part" : "parts"}`;
          return `
            <a href="series.html?id=${encodeURIComponent(series.id)}" class="series-card">
              <div class="series-card-eyebrow">
                <span class="series-label-chip">Series</span>
                <span class="series-part-count">${countLabel}</span>
              </div>
              <h2 class="series-card-title">${escHTML(series.title)}</h2>
              <p class="series-card-description">${escHTML(series.description)}</p>
              <div class="series-card-posts-preview">${previewItems}${moreNote}</div>
              <span class="series-card-cta">View series ${ARROW_SVG}</span>
            </a>`;
        }).join("");
        if (!cardsHTML.trim()) {
          container.innerHTML = "";
          return;
        }
        container.innerHTML = `<div class="series-section-label">Series</div>${cardsHTML}`;
      }
      function getSeriesSlugs() {
        return new Set(ALL_SERIES.flatMap((s) => s.posts));
      }
      function renderPosts(posts, filters, rawQ, isSearching) {
        const list = document.getElementById("post-list");
        const status = document.getElementById("search-status");
        let displayPosts = posts;
        if (!isSearching && !activeTagFilter) {
          const seriesSlugs = getSeriesSlugs();
          displayPosts = posts.filter((p) => !seriesSlugs.has(p.slug));
        }
        if (displayPosts.length === 0 && posts.length === 0) {
          list.innerHTML = `<p style="color:var(--muted);font-size:14px;margin-top:24px;">No posts match your search.</p>`;
          status.textContent = "";
          return;
        }
        const hlTerm = filters ? filters.phrase || filters.text || "" : "";
        const showSectionLabel =
          !isSearching &&
          !activeTagFilter &&
          ALL_SERIES.length > 0 &&
          displayPosts.length > 0;
        list.innerHTML =
          (showSectionLabel
            ? `<div class="posts-section-label">Standalone</div>`
            : "") +
          displayPosts
            .map((p) => {
              const { mon, year } = formatDate(p.date);
              const titleHl = highlight(escHTML(p.title), hlTerm);
              const tags = normaliseTags(p.tag);
              const tagChips = tags
                .map((t) => `<span class="post-tag-chip">${escHTML(t)}</span>`)
                .join("");
              const pinBadge = p.pinned
                ? `<span class="pin-badge" aria-label="Pinned">${PIN_SVG} pinned</span>`
                : "";
              return `
              <a href="post.html?slug=${encodeURIComponent(p.slug)}" class="post-item" role="listitem">
                <div class="post-date"><span>${mon}</span><span>${year}</span></div>
                <div>
                  <div class="post-tags">${tagChips}</div>
                  <h2 class="post-title">${titleHl}${pinBadge}</h2>
                  <p class="post-excerpt">${escHTML(p.excerpt)}</p>
                </div>
              </a>`;
            })
            .join("");
        if (rawQ && rawQ.trim()) {
          status.textContent = `${posts.length} ${posts.length === 1 ? "post" : "posts"} found`;
        } else if (activeTagFilter) {
          const label =
            activeTagFilter === "pinned"
              ? "pinned"
              : `tagged "${activeTagFilter}"`;
          status.textContent = `${posts.length} ${posts.length === 1 ? "post" : "posts"} ${label}`;
        } else {
          status.textContent = "";
        }
      }
      function buildTagPills() {
        const seen = new Set();
        let hasPinned = false;
        ALL_POSTS.forEach((p) => {
          normaliseTags(p.tag).forEach((t) => seen.add(t));
          if (p.pinned) hasPinned = true;
        });
        const container = document.getElementById("tag-filter-list");
        const tagPills = [...seen]
          .sort()
          .map(
            (t) =>
              `<button class="tag-pill" data-tag="${t.toLowerCase()}">${escHTML(t)}</button>`,
          )
          .join("");
        const pinnedPill = hasPinned
          ? `<button class="tag-pill" data-tag="pinned">${PIN_SVG} Pinned</button>`
          : "";
        container.innerHTML = tagPills + pinnedPill;
        container.querySelectorAll(".tag-pill").forEach((btn) => {
          btn.addEventListener("click", () => {
            const tag = btn.dataset.tag;
            if (activeTagFilter === tag) {
              activeTagFilter = null;
              btn.classList.remove("active");
            } else {
              activeTagFilter = tag;
              container
                .querySelectorAll(".tag-pill")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
            }
            run();
          });
        });
      }
      function run() {
        const q = document.getElementById("search-input").value;
        const order = document.getElementById("sort-select").value;
        document
          .getElementById("search-clear")
          .classList.toggle("visible", q.length > 0);
        const isSearching = !!(q.trim() || activeTagFilter);
        const filters = q.trim() ? parseQuery(q) : {};
        let results = ALL_POSTS.filter((p) =>
          matchPost(p, filters, activeTagFilter),
        );
        results = sortPosts(results, order);
        renderSeriesCards(isSearching);
        renderPosts(results, filters, q, isSearching);
      }
      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());
        window.SEO.setPage({
          title: "Writing",
          description: `Essays, notes, and series by ${cv.name} on creativity, building, and ideas.`,
          url: window.SEO.BASE_URL + "/writing.html",
          type: "website",
          breadcrumbs: [
            { name: "Home", url: window.SEO.BASE_URL + "/" },
            { name: "Writing", url: window.SEO.BASE_URL + "/writing.html" },
          ],
        });
        document.getElementById("nav-name").textContent = cv.name;
        document.getElementById("footer-name").textContent =
          `© ${new Date().getFullYear()} ${cv.name} · Made with care`;

        const results = await Promise.allSettled(
          BLOGS.map((slug) =>
            fetch(`blogs/${slug}.json`).then((r) => (r.ok ? r.json() : null)),
          ),
        );
        ALL_POSTS = results
          .filter((r) => r.status === "fulfilled" && r.value)
          .map((r) => r.value);

        try {
          ALL_SERIES = await fetch("blogs/series.json").then((r) =>
            r.ok ? r.json() : [],
          );
        } catch {
          ALL_SERIES = [];
        }

        buildTagPills();
        run();

        const inp = document.getElementById("search-input");
        const clearBtn = document.getElementById("search-clear");
        inp.addEventListener("input", run);
        document.getElementById("sort-select").addEventListener("change", run);
        clearBtn.addEventListener("click", () => {
          inp.value = "";
          run();
          inp.focus();
        });

        const urlTag = new URLSearchParams(window.location.search).get("tag");
        if (urlTag) {
          activeTagFilter = urlTag.toLowerCase();
          const pill = document
            .getElementById("tag-filter-list")
            .querySelector(`[data-tag="${activeTagFilter}"]`);
          if (pill) pill.classList.add("active");
          run();
        }
        document.addEventListener("keydown", (e) => {
          if (e.key === "/" && document.activeElement !== inp) {
            e.preventDefault();
            inp.focus();
            inp.select();
          }
        });
      }
      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
