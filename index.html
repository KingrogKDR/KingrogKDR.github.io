<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhishek Saikia</title>
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ── RESPONSIVE NAV ── */
      .menu-toggle {
        display: none;
        background: none;
        border: 1px solid var(--faint);
        border-radius: 4px;
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
        width: 36px;
        height: 36px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .menu-toggle:hover {
        border-color: var(--muted);
      }

      @media (max-width: 640px) {
        .menu-toggle {
          display: flex;
        }
        .nav-inner {
          padding: 0 20px;
          gap: 12px;
        }
        .nav-links {
          display: none;
          flex-direction: column;
          gap: 0;
          position: absolute;
          top: 56px;
          left: 0;
          right: 0;
          background: var(--nav-bg);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--faint);
          padding: 8px 0 16px;
          list-style: none;
        }
        .nav-links.open {
          display: flex;
        }
        .nav-links li a {
          display: block;
          padding: 12px 20px;
          font-size: 15px;
          border-bottom: 1px solid var(--faint);
        }
        .nav-links li:last-child a {
          border-bottom: none;
        }
        .nav-right {
          gap: 10px;
        }
        .page {
          padding: 96px 16px 64px;
        }
      }

      /* ── PAGE STYLES ── */
      .hero {
        padding: 140px 0 72px;
      }
      .hero-tag {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 20px;
      }
      .hero-name {
        font-family: "Lora", serif;
        font-size: clamp(40px, 7vw, 64px);
        line-height: 1.1;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 24px;
      }
      .hero-name em {
        font-style: italic;
        color: var(--accent);
      }
      .hero-bio {
        font-size: 18px;
        line-height: 1.7;
        color: var(--muted);
        max-width: 520px;
        margin-bottom: 36px;
        font-weight: 300;
      }
      .hero-cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--ink);
        color: var(--white);
        padding: 12px 24px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.02em;
        transition:
          background 0.2s,
          transform 0.15s;
      }
      .hero-cta:hover {
        background: #2e2e2a;
        transform: translateY(-1px);
      }
      .hero-divider {
        margin-top: 72px;
        border: none;
        border-top: 1px solid var(--faint);
      }
      .home-section {
        padding: 64px 0;
      }
      .home-section-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 32px;
      }
      .home-section-header h2 {
        font-family: "Lora", serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .see-all {
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.2s;
      }
      .see-all:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo" id="nav-name">Abhishek Saikia</a>
        <div class="nav-right">
          <ul class="nav-links" id="nav-links">
            <li><a href="writing.html">Writing</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-toggle-thumb"></span>
          </button>
        </div>
      </div>
    </nav>

    <div class="page">
      <div class="hero">
        <p class="hero-tag fade-in d1" id="hero-tag">
          Writer · Builder · Thinker
        </p>
        <h1 class="hero-name fade-in d2">
          Words &amp; work<br />by <em id="hero-name">Abhishek Saikia</em>
        </h1>
        <p class="hero-bio fade-in d3" id="hero-bio">Loading…</p>
        <a href="writing.html" class="hero-cta fade-in d4">Read the latest ↓</a>
        <hr class="hero-divider" />
      </div>

      <div class="home-section">
        <div class="home-section-header">
          <h2>Recent writing</h2>
          <a href="writing.html" class="see-all">All essays →</a>
        </div>
        <div class="post-list" id="recent-posts">
          <p class="loading">Loading…</p>
        </div>
      </div>
    </div>

    <footer>
      <p id="footer-name">© 2026 Abhishek Saikia · Made with care</p>
    </footer>

    <script>
      const BLOGS = ["on-slowness-as-a-creative-practice"];

      function formatDate(iso) {
        const d = new Date(iso);
        return {
          mon: d.toLocaleString("en", { month: "short" }),
          year: d.getFullYear(),
        };
      }

      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());

        document.title = cv.name;
        document.getElementById("nav-name").textContent = cv.name;
        document.getElementById("hero-tag").textContent = cv.tagline;
        document.getElementById("hero-name").textContent = cv.name;
        document.getElementById("hero-bio").textContent = cv.bio_short;
        document.getElementById("footer-name").textContent =
          `© ${new Date().getFullYear()} ${cv.name} · Made with care`;

        const posts = await Promise.all(
          BLOGS.slice(0, 3).map((slug) =>
            fetch(`blogs/${slug}.json`).then((r) => r.json()),
          ),
        );

        const list = document.getElementById("recent-posts");
        list.innerHTML = posts
          .map((p) => {
            const { mon, year } = formatDate(p.date);
            return `
              <a href="post.html?slug=${p.slug}" class="post-item">
                <div class="post-date"><span>${mon}</span><span>${year}</span></div>
                <div>
                  <p class="post-tag">${p.tag}</p>
                  <h3 class="post-title">${p.title}</h3>
                  <p class="post-excerpt">${p.excerpt}</p>
                </div>
              </a>`;
          })
          .join("");
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
