<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (filled in by seo.js at runtime; these are fallbacks for crawlers on first parse) -->
    <title>Abhishek Saikia — Writer · Programmer · Thinker</title>
    <meta
      name="description"
      content="Essays, projects, and ideas by Abhishek Saikia — writing on creativity, slowness, and building things with intention."
    />
    <link rel="canonical" href="https://kingrogkdr.github.io/" />

    <!-- Open Graph fallbacks -->
    <meta property="og:site_name" content="Abhishek Saikia" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Abhishek Saikia — Writer · Programmer · Thinker"
    />
    <meta
      property="og:description"
      content="Essays, projects, and ideas by Abhishek Saikia."
    />
    <meta property="og:url" content="https://kingrogkdr.github.io/" />
    <meta
      property="og:image"
      content="https://kingrogkdr.github.io/images/og-default.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abhishek Saikia" />
    <meta
      name="twitter:description"
      content="Essays, projects, and ideas by Abhishek Saikia."
    />
    <meta
      name="twitter:image"
      content="https://kingrogkdr.github.io/images/og-default.png"
    />

    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link rel="icon" href="images/favicon/favicon.ico" />

    <!-- Theme flash prevention: dark is the default working theme, light is opt-in and remembered -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        document.documentElement.setAttribute(
          "data-theme",
          saved === "light" ? "light" : "dark",
        );
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <div class="nav-left">
          <span class="window-dots"
            ><span></span><span></span><span></span
          ></span>
          <a href="index.html" class="nav-logo" id="nav-name"
            >abhishek-saikia</a
          >
        </div>
        <div class="nav-right">
          <ul class="nav-links" id="nav-links">
            <li><a href="writing.html">writing</a></li>
            <li><a href="projects.html">projects</a></li>
            <li><a href="contact.html">contact</a></li>
          </ul>
          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-toggle-thumb"></span>
          </button>
        </div>
      </div>
    </nav>

    <main>
      <div class="page">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <div class="content-col">
          <!-- HERO -->
          <section class="pane hero-pane fade-in d1" aria-label="Intro">
            <div class="pane-tab">home.tsx</div>
            <div class="pane-body">
              <p class="hero-tag" id="hero-tag">Loading…</p>
              <h1 class="hero-name">
                <span id="hero-name">Abhishek Saikia</span>
              </h1>
              <p class="hero-bio" id="hero-bio">Loading…</p>
              <a href="writing.html" class="hero-cta">Read the latest →</a>
            </div>
          </section>

          <!-- ABOUT -->
          <section
            class="pane fade-in d2"
            aria-label="About"
            itemscope
            itemtype="https://schema.org/Person"
          >
            <div class="pane-tab">about.md</div>
            <div class="pane-body about-layout">
              <div class="about-body" id="about-body" itemprop="description">
                <p>Loading…</p>
              </div>
              <div class="about-photo" id="about-photo">
                <div class="about-photo-placeholder">🧑</div>
              </div>
            </div>
          </section>

          <!-- PINNED WRITING -->
          <section class="fade-in d3" aria-label="Pinned writing">
            <div class="section-header">
              <p class="comment-label">pinned</p>
              <a href="writing.html" class="see-all">all posts →</a>
            </div>
            <div class="post-list" id="pinned-posts" role="list">
              <p class="loading">Loading…</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p id="footer-name">2026 Abhishek Saikia — Thanks for visiting!</p>
    </footer>

    <script src="seo.js"></script>
    <script src="common.js"></script>
    <script>
      const BLOGS = [
        "designing-metrics-for-athens-go-module-proxy",
        // add more slugs here
      ];

      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());

        window.SEO.setPage({
          title: cv.name + " — " + cv.tagline,
          description:
            cv.bio_short || "Essays, projects, and ideas by " + cv.name + ".",
          url: window.SEO.BASE_URL + "/",
          type: "website",
          breadcrumbs: [{ name: "Home", url: window.SEO.BASE_URL + "/" }],
        });

        document.getElementById("nav-name").textContent = cv.name
          .toLowerCase()
          .replace(/\s+/g, "-");
        document.getElementById("hero-tag").textContent = cv.tagline;
        document.getElementById("hero-name").textContent = cv.name;
        document.getElementById("hero-bio").textContent = cv.bio_short;
        document.getElementById("footer-name").textContent =
          `${new Date().getFullYear()} ${cv.name} — Thanks for visiting!`;

        document.getElementById("about-body").innerHTML = cv.bio_long
          .map((p) => `<p>${p}</p>`)
          .join("");

        if (cv.photo) {
          document.getElementById("about-photo").innerHTML =
            `<img src="${cv.photo}" alt="${cv.name}" itemprop="image">`;
        }

        const posts = await Promise.all(
          BLOGS.map((slug) =>
            fetch(`blogs/${slug}.md`)
              .then((r) => r.text())
              .then((raw) => ({ ...parsePostFile(raw).meta, slug })),
          ),
        );
        const pinned = posts.filter((p) => p.pinned === true);
        const list = document.getElementById("pinned-posts");

        if (pinned.length === 0) {
          list.innerHTML = `<p class="no-pinned">No pinned posts yet. Add <code>"pinned": true</code> to a blog's JSON to feature it here.</p>`;
          paintGutter();
          return;
        }

        list.innerHTML = pinned
          .map((p) => {
            const { mon, year } = formatDate(p.date);
            const tags = normaliseTags(p.tag);
            const tagChips = tags
              .map((t) => `<span class="post-tag-chip">${escHTML(t)}</span>`)
              .join("");
            return `
            <a href="post.html?slug=${encodeURIComponent(p.slug)}" class="post-item" role="listitem">
              <div class="post-meta"><span class="post-diff-mark">+</span>${mon} ${year}</div>
              <div>
                <div class="post-tags">${tagChips}</div>
                <h3 class="post-title">
                  ${escHTML(p.title)}
                  <span class="pinned-badge">pinned</span>
                </h3>
                <p class="post-excerpt">${escHTML(p.excerpt)}</p>
              </div>
            </a>`;
          })
          .join("");

        paintGutter();
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
