<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link rel="icon" href="images/favicon/favicon.ico" />
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ── RESPONSIVE NAV ── */
      .menu-toggle {
        display: none;
        background: none;
        border: 1px solid var(--faint);
        border-radius: 4px;
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
        width: 36px;
        height: 36px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .menu-toggle:hover {
        border-color: var(--muted);
      }

      @media (max-width: 640px) {
        .menu-toggle {
          display: flex;
        }
        .nav-inner {
          padding: 0 20px;
          gap: 12px;
        }
        .nav-links {
          display: none;
          flex-direction: column;
          gap: 0;
          position: absolute;
          top: 56px;
          left: 0;
          right: 0;
          background: var(--nav-bg);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--faint);
          padding: 8px 0 16px;
          list-style: none;
        }
        .nav-links.open {
          display: flex;
        }
        .nav-links li a {
          display: block;
          padding: 12px 20px;
          font-size: 15px;
          border-bottom: 1px solid var(--faint);
        }
        .nav-links li:last-child a {
          border-bottom: none;
        }
        .nav-right {
          gap: 10px;
        }
      }

      /* ── TOC (original fixed left sidebar) ── */
      .toc {
        position: fixed;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        width: 200px;
        padding: 0 24px 0 32px;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 10;
      }
      .toc.visible {
        opacity: 1;
      }

      .toc-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }

      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 1px solid var(--faint);
      }
      .toc-list a {
        display: block;
        padding: 5px 0 5px 14px;
        margin-left: -1px;
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.45;
        border-left: 2px solid transparent;
        transition:
          color 0.2s,
          border-color 0.15s;
      }
      .toc-list a:hover {
        color: var(--ink);
      }
      .toc-list a.active {
        color: var(--ink);
        border-left-color: var(--accent);
        font-weight: 500;
      }
      .toc-empty-msg {
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
        line-height: 1.5;
        padding-left: 14px;
        border-left: 1px solid var(--faint);
      }

      @media (max-width: 1000px) {
        .toc {
          display: none;
        }
      }

      /* ── CENTERED CONTENT ── */
      .post-page {
        max-width: 720px;
        margin: 0 auto;
        padding: 100px 32px 100px;
      }

      /* ── SECTION HEADINGS ── */
      .post-section-heading {
        font-family: "Lora", serif;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--ink);
        opacity: 0.8;
        margin: 52px 0 20px;
        scroll-margin-top: 80px;
        line-height: 1.3;
      }

      /* ── TAG CHIPS ── */
      .post-header-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }
      .post-header-tag-chip {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 99px;
        border: 1px solid var(--faint);
        color: var(--muted);
        background: transparent;
        line-height: 1;
        transition:
          border-color 0.2s,
          color 0.2s;
        text-decoration: none;
      }
      .post-header-tag-chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ── SERIES BANNER ── */
      .series-banner {
        border: 1px solid var(--faint);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 16px;
        background: color-mix(in srgb, var(--accent) 3%, transparent);
      }
      .series-banner-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .series-banner-left {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .series-chip {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        padding: 3px 8px;
        border-radius: 99px;
      }
      .series-banner-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        text-decoration: none;
        transition: color 0.15s;
        letter-spacing: -0.01em;
      }
      .series-banner-name:hover {
        color: var(--accent);
      }
      .series-banner-part {
        font-size: 11.5px;
        color: var(--muted);
      }
      .series-banner-parts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .series-banner-part-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        padding: 4px 10px;
        border: 1px solid var(--faint);
        border-radius: 6px;
        transition:
          border-color 0.15s,
          color 0.15s;
        white-space: nowrap;
      }
      .series-banner-part-link:hover {
        border-color: var(--accent);
        color: var(--ink);
      }
      .series-banner-part-link.current {
        border-color: var(--accent);
        color: var(--ink);
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        font-weight: 500;
        pointer-events: none;
      }
      .series-banner-part-link.unavailable {
        opacity: 0.35;
        pointer-events: none;
        font-style: italic;
      }
      .part-num-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--muted);
        opacity: 0.6;
        margin-right: 1px;
      }
      .series-banner-part-link.current .part-num-label {
        opacity: 1;
        color: var(--accent);
      }

      /* ── SERIES PREV/NEXT — compact strip between banner and post header ── */
      .series-nav-strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 32px;
        padding: 8px 0;
        border-bottom: 1px solid var(--faint);
      }
      .series-nav-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        padding: 2px 0;
        transition: color 0.15s;
        max-width: 42%;
      }
      .series-nav-link:hover {
        color: var(--ink);
      }
      .series-nav-link.faded {
        opacity: 0.3;
        pointer-events: none;
      }
      .series-nav-link svg {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
      }
      .series-nav-link-label {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }
      .series-nav-center {
        font-size: 11px;
        color: var(--muted);
        opacity: 0.45;
        white-space: nowrap;
        letter-spacing: 0.05em;
        flex-shrink: 0;
      }

      @media (max-width: 540px) {
        .post-page {
          padding: 84px 18px 64px;
        }
        .series-nav-center {
          display: none;
        }
        .series-nav-link {
          max-width: 48%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo" id="nav-name">Abhishek Saikia</a>
        <div class="nav-right">
          <ul class="nav-links" id="nav-links">
            <li><a href="writing.html">Writing</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-toggle-thumb"></span>
          </button>
        </div>
      </div>
    </nav>

    <aside class="toc" id="toc" aria-label="Table of contents">
      <p class="toc-label">Contents</p>
      <ul class="toc-list" id="toc-list"></ul>
    </aside>

    <div class="post-page">
      <a href="writing.html" class="back-link">← All writing</a>
      <article id="post-content">
        <p class="loading">Loading…</p>
      </article>
    </div>

    <footer>
      <p id="footer-name">© 2026 Abhishek Saikia · Made with care</p>
    </footer>

    <script>
      const ARROW_LEFT = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6H4M6 4L4 6l2 2"/></svg>`;
      const ARROW_RIGHT = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h4M6 4l2 2-2 2"/></svg>`;

      function formatDate(iso) {
        return new Date(iso).toLocaleDateString("en", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }
      function resolveImageSrc(src) {
        if (/^https?:\/\//i.test(src) || src.startsWith("//")) return src;
        return src;
      }
      function slugify(text) {
        return text
          .toLowerCase()
          .replace(/[^\w\s-]/g, "")
          .trim()
          .replace(/\s+/g, "-");
      }
      function normaliseTags(raw) {
        if (!raw) return [];
        return Array.isArray(raw) ? raw : [raw];
      }
      function renderTags(raw) {
        const tags = normaliseTags(raw);
        if (!tags.length) return "";
        const chips = tags
          .map(
            (t) =>
              `<a href="writing.html?tag=${encodeURIComponent(t.toLowerCase())}" class="post-header-tag-chip">${t}</a>`,
          )
          .join("");
        return `<div class="post-header-tags">${chips}</div>`;
      }
      function renderContent(items) {
        return items
          .map((item) => {
            if (typeof item === "string") {
              return `<p>${item.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</p>`;
            }
            if (item.heading) {
              const id = slugify(item.heading);
              return `<h2 id="${id}" class="post-section-heading">${item.heading}</h2>`;
            }
            if (item.image) {
              const src = resolveImageSrc(item.image);
              const caption = item.caption
                ? `<figcaption class="post-image-caption">${item.caption}</figcaption>`
                : "";
              return `
              <figure class="post-image">
                <img src="${src}" alt="${item.caption || ""}" loading="lazy"
                  onerror="this.closest('figure').classList.add('img-error')">
                ${caption}
              </figure>`;
            }
            return "";
          })
          .join("");
      }

      function buildTOC() {
        const headings = document.querySelectorAll(
          "#post-content h2.post-section-heading",
        );
        const toc = document.getElementById("toc");
        const tocList = document.getElementById("toc-list");

        toc.classList.add("visible");

        if (headings.length < 2) {
          tocList.insertAdjacentHTML(
            "afterend",
            `<p class="toc-empty-msg">No sections in this post.</p>`,
          );
          tocList.remove();
          return;
        }

        tocList.innerHTML = Array.from(headings)
          .map((h) => `<li><a href="#${h.id}">${h.textContent}</a></li>`)
          .join("");

        const links = tocList.querySelectorAll("a");
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                links.forEach((l) => l.classList.remove("active"));
                const match = tocList.querySelector(
                  `a[href="#${entry.target.id}"]`,
                );
                if (match) match.classList.add("active");
              }
            });
          },
          { rootMargin: "-15% 0px -75% 0px", threshold: 0 },
        );
        headings.forEach((h) => observer.observe(h));
      }

      function buildSeriesBanner(series, seriesPosts, currentSlug) {
        const totalDefined = series.posts.length;
        const currentIdx = series.posts.indexOf(currentSlug);
        const partNum = currentIdx + 1;

        const partsHTML = series.posts
          .map((slug, i) => {
            const post = seriesPosts[i];
            const isCurrent = slug === currentSlug;
            const isAvailable = !!post;
            const partLabel = `<span class="part-num-label">${i + 1}.</span> ${post ? post.title : "Coming soon"}`;
            if (isCurrent)
              return `<span class="series-banner-part-link current">${partLabel}</span>`;
            if (!isAvailable)
              return `<span class="series-banner-part-link unavailable">${partLabel}</span>`;
            return `<a href="post.html?slug=${slug}" class="series-banner-part-link">${partLabel}</a>`;
          })
          .join("");

        return `
          <div class="series-banner fade-in d1">
            <div class="series-banner-top">
              <div class="series-banner-left">
                <span class="series-chip">Series</span>
                <a href="series.html?id=${encodeURIComponent(series.id)}" class="series-banner-name">${series.title}</a>
              </div>
              <span class="series-banner-part">Part ${partNum} of ${totalDefined}</span>
            </div>
            <div class="series-banner-parts">${partsHTML}</div>
          </div>`;
      }

      function buildSeriesNavStrip(series, seriesPosts, currentSlug) {
        const currentIdx = series.posts.indexOf(currentSlug);
        const totalDefined = series.posts.length;

        const prevSlug = currentIdx > 0 ? series.posts[currentIdx - 1] : null;
        const nextSlug =
          currentIdx < totalDefined - 1 ? series.posts[currentIdx + 1] : null;
        const prevPost = prevSlug
          ? seriesPosts[series.posts.indexOf(prevSlug)]
          : null;
        const nextPost = nextSlug
          ? seriesPosts[series.posts.indexOf(nextSlug)]
          : null;

        const prevLink = prevPost
          ? `<a href="post.html?slug=${prevSlug}" class="series-nav-link" title="${prevPost.title}">
              ${ARROW_LEFT}<span class="series-nav-link-label">${prevPost.title}</span>
            </a>`
          : `<span class="series-nav-link faded">${ARROW_LEFT}<span class="series-nav-link-label">First part</span></span>`;

        const nextLink = nextPost
          ? `<a href="post.html?slug=${nextSlug}" class="series-nav-link" style="justify-content:flex-end;text-align:right" title="${nextPost.title}">
              <span class="series-nav-link-label">${nextPost.title}</span>${ARROW_RIGHT}
            </a>`
          : nextSlug
            ? `<span class="series-nav-link faded" style="justify-content:flex-end"><span class="series-nav-link-label">Coming soon</span>${ARROW_RIGHT}</span>`
            : `<a href="series.html?id=${encodeURIComponent(series.id)}" class="series-nav-link" style="justify-content:flex-end;text-align:right">
                <span class="series-nav-link-label">View series</span>${ARROW_RIGHT}
              </a>`;

        return `
          <div class="series-nav-strip">
            ${prevLink}
            <span class="series-nav-center">${currentIdx + 1} / ${totalDefined}</span>
            ${nextLink}
          </div>`;
      }

      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());
        document.getElementById("nav-name").textContent = cv.name;
        document.getElementById("footer-name").textContent =
          `© ${new Date().getFullYear()} ${cv.name} · Made with care`;

        const slug = new URLSearchParams(window.location.search).get("slug");
        if (!slug) {
          document.getElementById("post-content").innerHTML =
            "<p>Post not found.</p>";
          return;
        }

        const post = await fetch(`blogs/${slug}.json`).then((r) => r.json());
        document.title = `${post.title} — ${cv.name}`;

        // Load series data if post belongs to one
        let series = null;
        let seriesPosts = [];
        if (post.series) {
          try {
            const allSeries = await fetch("blogs/series.json").then((r) =>
              r.json(),
            );
            series = allSeries.find((s) => s.id === post.series) || null;
            if (series) {
              seriesPosts = await Promise.all(
                series.posts.map((s) =>
                  fetch(`blogs/${s}.json`)
                    .then((r) => (r.ok ? r.json() : null))
                    .catch(() => null),
                ),
              );
            }
          } catch {
            series = null;
          }
        }

        const seriesBannerHTML = series
          ? buildSeriesBanner(series, seriesPosts, slug)
          : "";
        const seriesNavStripHTML = series
          ? buildSeriesNavStrip(series, seriesPosts, slug)
          : "";

        document.getElementById("post-content").innerHTML = `
          ${seriesBannerHTML}
          ${seriesNavStripHTML}
          <div class="post-header fade-in d2">
            ${renderTags(post.tag)}
            <h1 class="post-header-title">${post.title}</h1>
            <p class="post-header-meta">${formatDate(post.date)}</p>
          </div>
          <hr class="post-header-divider">
          <div class="post-body fade-in d3">
            ${renderContent(post.content)}
          </div>
        `;

        buildTOC();
      }

      init();
    </script>
    <script src="nav.js"></script>
  </body>
</html>
