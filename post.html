<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post — Abhishek Saikia</title>
    <meta name="description" content="" />
    <!-- canonical and OG tags filled by seo.js at runtime -->
    <meta property="og:type" content="article" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link rel="icon" href="images/favicon/favicon.ico" />

    <!-- Theme flash prevention: dark is the default working theme, light is opt-in and remembered -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        document.documentElement.setAttribute(
          "data-theme",
          saved === "light" ? "light" : "dark",
        );
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/protobuf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/toml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/graphql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/hcl.min.js"></script>
    <!-- Markdown renderer: post bodies are now plain Markdown (see blogs/*.md format) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <nav></nav>

    <aside class="toc" id="toc" aria-label="Table of contents">
      <p class="toc-label">contents</p>
      <ul class="toc-list" id="toc-list"></ul>
    </aside>

    <!-- Share toast notification -->
    <div class="share-toast" id="share-toast" role="status" aria-live="polite">
      <svg viewBox="0 0 14 14"><polyline points="2 7 5.5 10.5 12 4" /></svg>
      Link copied
    </div>

    <main>
      <div class="post-page">
        <a href="writing.html" class="back-link">← all writing</a>
        <article
          id="post-content"
          itemscope
          itemtype="https://schema.org/BlogPosting"
        >
          <p class="loading">Loading…</p>
        </article>
      </div>
    </main>

    <footer>
      <p id="footer-name">2026 Abhishek Saikia — Thanks for visiting!</p>
    </footer>

    <script src="seo.js"></script>
    <script src="common.js"></script>
    <script>
      const ARROW_LEFT = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6H4M6 4L4 6l2 2"/></svg>`;
      const ARROW_RIGHT = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h4M6 4l2 2-2 2"/></svg>`;
      const SHARE_ICON = `<svg viewBox="0 0 14 14"><circle cx="11" cy="2.5" r="1.5"/><circle cx="11" cy="11.5" r="1.5"/><circle cx="3" cy="7" r="1.5"/><line x1="4.4" y1="7.7" x2="9.7" y2="10.9"/><line x1="9.7" y1="3.1" x2="4.4" y2="6.3"/></svg>`;

      // escHTML / normaliseTags / paintGutter come from common.js.
      // common.js's formatDate() returns a short {mon, year} pair for list
      // views — this page needs a full written-out date, so it's named
      // differently to avoid clashing.
      function formatDateLong(iso) {
        return new Date(iso).toLocaleDateString("en", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }
      function readingTime(markdown) {
        const words = markdown.trim().split(/\s+/).filter(Boolean).length;
        const mins = Math.max(1, Math.round(words / 200));
        return `${mins} min read`;
      }
      function slugify(text) {
        return text
          .toLowerCase()
          .replace(/[^\w\s-]/g, "")
          .trim()
          .replace(/\s+/g, "-");
      }

      /* ── Share ── */
      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById("share-toast");
        toast.childNodes[2].textContent = " " + msg; // update text node after icon
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2400);
      }

      async function sharePost(url, title, text) {
        if (navigator.share) {
          try {
            await navigator.share({ title, text, url });
            return;
          } catch (e) {
            if (e.name === "AbortError") return; // user cancelled — do nothing
          }
        }
        try {
          await navigator.clipboard.writeText(url);
          showToast("Link copied");
        } catch {
          const inp = document.createElement("input");
          inp.value = url;
          document.body.appendChild(inp);
          inp.select();
          document.execCommand("copy");
          document.body.removeChild(inp);
          showToast("Link copied");
        }
      }

      function renderTags(raw) {
        const tags = normaliseTags(raw);
        if (!tags.length) return "";
        const chips = tags
          .map(
            (t) =>
              `<a href="writing.html?tag=${encodeURIComponent(t.toLowerCase())}" class="post-header-tag-chip" rel="tag">${escHTML(t)}</a>`,
          )
          .join("");
        return `<div class="post-header-tags">${chips}</div>`;
      }

      /* ── Markdown rendering ──
       * Post bodies are plain Markdown (Notion/Obsidian export friendly).
       * One extra bit of syntax is supported on top of standard Markdown:
       * ==highlighted text== (Obsidian's native highlight syntax), which
       * we convert to <mark> before handing off to marked — marked passes
       * raw HTML through untouched, so this is a simple string swap rather
       * than a custom parser extension.
       */
      function renderMarkdown(md) {
        const withMarks = md.replace(/==(.+?)==/g, "<mark>$1</mark>");
        return marked.parse(withMarks);
      }

      // Post-processes the rendered Markdown HTML to wire up the site's
      // custom presentation: heading ids for the TOC, code-block chrome,
      // image captions, and Obsidian-style callouts (> [!note] ...).
      function postProcessBody(root) {
        // Headings → comment-style section headings, with ids for the TOC
        root.querySelectorAll("h1, h2, h3").forEach((h) => {
          h.classList.add("post-section-heading");
          h.id = slugify(h.textContent);
        });

        // Code blocks → header bar with language + copy button
        root.querySelectorAll("pre").forEach((pre) => {
          const codeEl = pre.querySelector("code");
          if (!codeEl) return;
          const langMatch = (codeEl.className || "").match(/language-(\S+)/);
          const lang = langMatch ? langMatch[1] : "plaintext";
          const id = "code-" + Math.random().toString(36).slice(2, 7);
          codeEl.id = id;

          const wrap = document.createElement("div");
          wrap.className = "post-code-block";
          wrap.innerHTML = `
            <div class="post-code-header">
              <span class="post-code-lang">${escHTML(lang)}</span>
              <button class="post-code-copy" type="button">copy</button>
            </div>`;
          pre.replaceWith(wrap);
          wrap.appendChild(pre);
          wrap
            .querySelector(".post-code-copy")
            .addEventListener("click", (e) => copyCode(id, e.currentTarget));

          // An italicised paragraph directly after a code block becomes its caption
          const next = wrap.nextElementSibling;
          if (
            next &&
            next.tagName === "P" &&
            next.children.length === 1 &&
            next.children[0].tagName === "EM"
          ) {
            const cap = document.createElement("div");
            cap.className = "post-code-caption";
            cap.innerHTML = next.children[0].innerHTML;
            wrap.appendChild(cap);
            next.remove();
          }
        });

        // A solo image paragraph followed by an italicised paragraph becomes a captioned figure
        root.querySelectorAll("p > img:only-child").forEach((img) => {
          const p = img.parentElement;
          const fig = document.createElement("figure");
          fig.className = "post-image";
          img.setAttribute("loading", "lazy");
          img.addEventListener("error", () => fig.classList.add("img-error"));
          fig.appendChild(img);
          const next = p.nextElementSibling;
          if (
            next &&
            next.tagName === "P" &&
            next.children.length === 1 &&
            next.children[0].tagName === "EM"
          ) {
            const figcaption = document.createElement("figcaption");
            figcaption.className = "post-image-caption";
            figcaption.innerHTML = next.children[0].innerHTML;
            fig.appendChild(figcaption);
            next.remove();
          }
          p.replaceWith(fig);
        });

        // Obsidian-style callouts: "> [!note] ..." → styled note/tip/warning boxes
        root.querySelectorAll("blockquote").forEach((bq) => {
          const firstP = bq.querySelector("p");
          if (!firstP) return;
          const m = firstP.innerHTML.match(/^\[!(\w+)\]\s*(.*)$/i);
          if (!m) return;
          const rawType = m[1].toLowerCase();
          const typeMap = {
            note: "info",
            info: "info",
            tip: "tip",
            success: "tip",
            warning: "warning",
            caution: "warning",
            important: "warning",
            danger: "warning",
          };
          const type = typeMap[rawType] || "info";
          const iconMap = { info: "i", tip: "$", warning: "!" };
          if (m[2] && m[2].trim()) {
            firstP.innerHTML = m[2];
          } else {
            firstP.remove();
          }
          const div = document.createElement("div");
          div.className = `post-note post-note--${type}`;
          const icon = document.createElement("span");
          icon.className = "post-note-icon";
          icon.textContent = iconMap[type];
          const inner = document.createElement("div");
          inner.innerHTML = bq.innerHTML;
          div.appendChild(icon);
          div.appendChild(inner);
          bq.replaceWith(div);
        });
      }

      function buildTOC() {
        const headings = document.querySelectorAll(
          "#post-content .post-section-heading",
        );
        const toc = document.getElementById("toc");
        const tocList = document.getElementById("toc-list");
        toc.classList.add("visible");
        if (headings.length < 2) {
          tocList.insertAdjacentHTML(
            "afterend",
            `<p class="toc-empty-msg">No sections in this post.</p>`,
          );
          tocList.remove();
          return;
        }
        tocList.innerHTML = Array.from(headings)
          .map(
            (h) => `<li><a href="#${h.id}">${escHTML(h.textContent)}</a></li>`,
          )
          .join("");
        const links = tocList.querySelectorAll("a");
        function updateActiveTOC() {
          const scrollY = window.scrollY + 100;
          let current = headings[0];
          headings.forEach((h) => {
            if (h.offsetTop <= scrollY) current = h;
          });
          links.forEach((l) => l.classList.remove("active"));
          const match = tocList.querySelector(`a[href="#${current.id}"]`);
          if (match) match.classList.add("active");
        }
        updateActiveTOC();
        window.addEventListener("scroll", updateActiveTOC, { passive: true });
      }

      function buildSeriesBanner(series, seriesPosts, currentSlug) {
        const totalDefined = series.posts.length;
        const currentIdx = series.posts.indexOf(currentSlug);
        const partNum = currentIdx + 1;
        const partsHTML = series.posts
          .map((slug, i) => {
            const post = seriesPosts[i];
            const isCurrent = slug === currentSlug;
            const partLabel = `<span class="part-num-label">${i + 1}.</span><span class="series-banner-part-title">${post ? escHTML(post.title) : "Coming soon"}</span>`;
            if (isCurrent)
              return `<span class="series-banner-part-link current">${partLabel}</span>`;
            if (!post)
              return `<span class="series-banner-part-link unavailable">${partLabel}</span>`;
            return `<a href="post.html?slug=${encodeURIComponent(slug)}" class="series-banner-part-link">${partLabel}</a>`;
          })
          .join("");
        return `
          <div class="series-banner fade-in d1">
            <div class="series-banner-top">
              <div class="series-banner-left">
                <span class="series-chip">series</span>
                <a href="series.html?id=${encodeURIComponent(series.id)}" class="series-banner-name">${escHTML(series.title)}</a>
              </div>
              <span class="series-banner-part">part ${partNum} of ${totalDefined}</span>
            </div>
            <div class="series-banner-parts">${partsHTML}</div>
          </div>`;
      }

      function buildSeriesNavStrip(series, seriesPosts, currentSlug) {
        const currentIdx = series.posts.indexOf(currentSlug);
        const totalDefined = series.posts.length;
        const prevSlug = currentIdx > 0 ? series.posts[currentIdx - 1] : null;
        const nextSlug =
          currentIdx < totalDefined - 1 ? series.posts[currentIdx + 1] : null;
        const prevPost = prevSlug
          ? seriesPosts[series.posts.indexOf(prevSlug)]
          : null;
        const nextPost = nextSlug
          ? seriesPosts[series.posts.indexOf(nextSlug)]
          : null;
        const prevLink = prevPost
          ? `<a href="post.html?slug=${encodeURIComponent(prevSlug)}" class="series-nav-link" title="${escHTML(prevPost.title)}">${ARROW_LEFT}<span class="series-nav-link-label">${escHTML(prevPost.title)}</span></a>`
          : `<span class="series-nav-link faded">${ARROW_LEFT}<span class="series-nav-link-label">First part</span></span>`;
        const nextLink = nextPost
          ? `<a href="post.html?slug=${encodeURIComponent(nextSlug)}" class="series-nav-link" style="justify-content:flex-end;text-align:right" title="${escHTML(nextPost.title)}"><span class="series-nav-link-label">${escHTML(nextPost.title)}</span>${ARROW_RIGHT}</a>`
          : nextSlug
            ? `<span class="series-nav-link faded" style="justify-content:flex-end"><span class="series-nav-link-label">Coming soon</span>${ARROW_RIGHT}</span>`
            : `<a href="series.html?id=${encodeURIComponent(series.id)}" class="series-nav-link" style="justify-content:flex-end;text-align:right"><span class="series-nav-link-label">View series</span>${ARROW_RIGHT}</a>`;
        return `
          <div class="series-nav-strip">
            ${prevLink}
            <span class="series-nav-center">${currentIdx + 1} / ${totalDefined}</span>
            ${nextLink}
          </div>`;
      }

      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());
        document.getElementById("footer-name").textContent =
          `${new Date().getFullYear()} ${cv.name} — Thanks for visiting!`;

        const slug = new URLSearchParams(window.location.search).get("slug");
        if (!slug) {
          document.getElementById("post-content").innerHTML =
            "<p>Post not found.</p>";
          return;
        }

        const raw = await fetch(`blogs/${encodeURIComponent(slug)}.md`)
          .then((r) => {
            if (!r.ok) throw new Error("Not found");
            return r.text();
          })
          .catch(() => null);

        if (!raw) {
          document.getElementById("post-content").innerHTML =
            "<p>Post not found.</p>";
          return;
        }

        let post, body;
        try {
          ({ meta: post, body } = parsePostFile(raw));
        } catch (e) {
          document.getElementById("post-content").innerHTML =
            `<p>Couldn't read this post: ${escHTML(e.message)}</p>`;
          return;
        }

        const canonicalUrl = `${window.SEO.BASE_URL}/post/${encodeURIComponent(slug)}.html`;
        const tags = normaliseTags(post.tag);

        const ogImage = post["og-image"]
          ? post["og-image"].startsWith("http")
            ? post["og-image"]
            : `${window.SEO.BASE_URL}/${post["og-image"]}`
          : window.SEO.DEFAULT_IMAGE;

        window.SEO.setPage({
          title: post.title,
          description: post.description || post.excerpt,
          url: canonicalUrl,
          type: "article",
          image: ogImage,
          article: {
            publishedTime: post.date,
            modifiedTime: post.updated || post.date,
            tags: tags,
            author: cv.name,
            seriesName: post.series || null,
          },
          breadcrumbs: [
            { name: "Home", url: window.SEO.BASE_URL + "/" },
            { name: "Blogs", url: window.SEO.BASE_URL + "/writing.html" },
            { name: post.title, url: canonicalUrl },
          ],
        });

        // ── Series ──
        let series = null,
          seriesPosts = [];
        if (post.series) {
          try {
            const allSeries = await fetch("blogs/series.json").then((r) =>
              r.json(),
            );
            series = allSeries.find((s) => s.id === post.series) || null;
            if (series) {
              seriesPosts = await Promise.all(
                series.posts.map((s) =>
                  fetch(`blogs/${encodeURIComponent(s)}.md`)
                    .then((r) => (r.ok ? r.text() : null))
                    .then((t) => (t ? parsePostFile(t).meta : null))
                    .catch(() => null),
                ),
              );
            }
          } catch {
            series = null;
          }
        }

        const seriesBannerHTML = series
          ? buildSeriesBanner(series, seriesPosts, slug)
          : "";
        const seriesNavStripHTML = series
          ? buildSeriesNavStrip(series, seriesPosts, slug)
          : "";

        document.getElementById("post-content").innerHTML = `
          ${seriesBannerHTML}
          ${seriesNavStripHTML}
          <div class="post-header fade-in d2">
            ${renderTags(post.tag)}
            <h1 class="post-header-title" itemprop="headline">${escHTML(post.title)}</h1>
            <div class="post-header-meta-row">
              <p class="post-header-meta">
                <time itemprop="datePublished" datetime="${post.date}">${formatDateLong(post.date)}</time>
                <span class="post-meta-sep">·</span>
                <span class="post-read-time">${readingTime(body)}</span>
              </p>
              <button class="share-btn" aria-label="Share this post">${SHARE_ICON} share</button>
            </div>
          </div>
          <hr class="post-header-divider">
          <div class="post-body fade-in d3" id="post-body-root" itemprop="articleBody"></div>`;

        document.getElementById("post-body-root").innerHTML =
          renderMarkdown(body);
        postProcessBody(document.getElementById("post-body-root"));

        const shareBtn = document.querySelector(".share-btn");
        if (shareBtn) {
          shareBtn.addEventListener("click", () => {
            sharePost(canonicalUrl, post.title, post.excerpt || "");
          });
        }

        buildTOC();
        document.querySelectorAll(".post-code-block code").forEach((el) => {
          try {
            hljs.highlightElement(el);
          } catch (err) {
            console.warn("hljs failed to highlight block:", err);
          }
        });
      }

      init();

      function copyCode(id, btn) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
          btn.textContent = "copied!";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "copy";
            btn.classList.remove("copied");
          }, 2000);
        });
      }
    </script>
    <script src="nav.js"></script>
  </body>
</html>
