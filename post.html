<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post</title>
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ── RESPONSIVE NAV ── */
      .menu-toggle {
        display: none;
        background: none;
        border: 1px solid var(--faint);
        border-radius: 4px;
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
        width: 36px;
        height: 36px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .menu-toggle:hover {
        border-color: var(--muted);
      }

      @media (max-width: 640px) {
        .menu-toggle {
          display: flex;
        }
        .nav-inner {
          padding: 0 20px;
          gap: 12px;
        }
        .nav-links {
          display: none;
          flex-direction: column;
          gap: 0;
          position: absolute;
          top: 56px;
          left: 0;
          right: 0;
          background: var(--nav-bg);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--faint);
          padding: 8px 0 16px;
          list-style: none;
        }
        .nav-links.open {
          display: flex;
        }
        .nav-links li a {
          display: block;
          padding: 12px 20px;
          font-size: 15px;
          border-bottom: 1px solid var(--faint);
        }
        .nav-links li:last-child a {
          border-bottom: none;
        }
        .nav-right {
          gap: 10px;
        }
      }

      /* ── TOC: fixed to far left, content centered independently ── */

      /* The TOC sits fixed on the left edge of the viewport */
      .toc {
        position: fixed;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        width: 200px;
        padding: 0 24px 0 32px;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 10;
      }
      .toc.visible {
        opacity: 1;
      }

      .toc-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }

      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 1px solid var(--faint);
      }

      .toc-list a {
        display: block;
        padding: 5px 0 5px 14px;
        margin-left: -1px;
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.45;
        border-left: 2px solid transparent;
        transition:
          color 0.2s,
          border-color 0.15s;
      }
      .toc-list a:hover {
        color: var(--ink);
      }
      .toc-list a.active {
        color: var(--ink);
        border-left-color: var(--accent);
        font-weight: 500;
      }

      /* Fallback for posts with no headings */
      .toc-empty-msg {
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
        line-height: 1.5;
        padding-left: 14px;
        border-left: 1px solid var(--faint);
      }

      /* ── CENTERED CONTENT ── */
      .post-page {
        max-width: 720px;
        margin: 0 auto;
        padding: 100px 32px 100px;
      }

      /* ── SECTION HEADINGS ── */
      .post-section-heading {
        font-family: "Lora", serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin: 52px 0 20px;
        scroll-margin-top: 80px;
        line-height: 1.3;
      }

      /* ── RESPONSIVE: hide TOC on smaller screens ── */
      @media (max-width: 1000px) {
        .toc {
          display: none;
        }
      }

      @media (max-width: 540px) {
        .post-page {
          padding: 84px 18px 64px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo" id="nav-name">Abhishek Saikia</a>
        <div class="nav-right">
          <ul class="nav-links" id="nav-links">
            <li><a href="writing.html">Writing</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-toggle-thumb"></span>
          </button>
        </div>
      </div>
    </nav>

    <!-- TOC lives outside the content flow, fixed to left -->
    <aside class="toc" id="toc" aria-label="Table of contents">
      <p class="toc-label">Contents</p>
      <ul class="toc-list" id="toc-list"></ul>
    </aside>

    <!-- Content is independently centered -->
    <div class="post-page">
      <a href="writing.html" class="back-link">← All writing</a>
      <article id="post-content">
        <p class="loading">Loading…</p>
      </article>
    </div>

    <footer>
      <p id="footer-name">© 2026 Abhishek Saikia · Made with care</p>
    </footer>

    <script>
      function formatDate(iso) {
        return new Date(iso).toLocaleDateString("en", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function resolveImageSrc(src) {
        if (/^https?:\/\//i.test(src) || src.startsWith("//")) return src;
        return src;
      }

      function slugify(text) {
        return text
          .toLowerCase()
          .replace(/[^\w\s-]/g, "")
          .trim()
          .replace(/\s+/g, "-");
      }

      function renderContent(items) {
        return items
          .map((item) => {
            if (typeof item === "string") {
              return `<p>${item.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</p>`;
            }
            if (item.heading) {
              const id = slugify(item.heading);
              return `<h2 id="${id}" class="post-section-heading">${item.heading}</h2>`;
            }
            if (item.image) {
              const src = resolveImageSrc(item.image);
              const caption = item.caption
                ? `<figcaption class="post-image-caption">${item.caption}</figcaption>`
                : "";
              return `
              <figure class="post-image">
                <img src="${src}" alt="${item.caption || ""}" loading="lazy"
                  onerror="this.closest('figure').classList.add('img-error')">
                ${caption}
              </figure>`;
            }
            return "";
          })
          .join("");
      }

      function buildTOC() {
        const headings = document.querySelectorAll(
          "#post-content h2.post-section-heading",
        );
        const toc = document.getElementById("toc");
        const tocList = document.getElementById("toc-list");

        toc.classList.add("visible");

        if (headings.length < 2) {
          // Fallback message
          tocList.insertAdjacentHTML(
            "afterend",
            `<p class="toc-empty-msg">No sections in this post.</p>`,
          );
          tocList.remove();
          return;
        }

        tocList.innerHTML = Array.from(headings)
          .map((h) => `<li><a href="#${h.id}">${h.textContent}</a></li>`)
          .join("");

        // Highlight active section on scroll
        const links = tocList.querySelectorAll("a");
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                links.forEach((l) => l.classList.remove("active"));
                const match = tocList.querySelector(
                  `a[href="#${entry.target.id}"]`,
                );
                if (match) match.classList.add("active");
              }
            });
          },
          { rootMargin: "-15% 0px -75% 0px", threshold: 0 },
        );
        headings.forEach((h) => observer.observe(h));
      }

      async function init() {
        const cv = await fetch("cv.json").then((r) => r.json());
        document.getElementById("nav-name").textContent = cv.name;
        document.getElementById("footer-name").textContent =
          `© ${new Date().getFullYear()} ${cv.name} · Made with care`;

        const slug = new URLSearchParams(window.location.search).get("slug");
        if (!slug) {
          document.getElementById("post-content").innerHTML =
            "<p>Post not found.</p>";
          return;
        }

        const post = await fetch(`blogs/${slug}.json`).then((r) => r.json());
        document.title = `${post.title} — ${cv.name}`;

        document.getElementById("post-content").innerHTML = `
          <div class="post-header fade-in d1">
            <p class="post-header-tag">${post.tag}</p>
            <h1 class="post-header-title">${post.title}</h1>
            <p class="post-header-meta">${formatDate(post.date)}</p>
          </div>
          <hr class="post-header-divider">
          <div class="post-body fade-in d2">
            ${renderContent(post.content)}
          </div>
        `;

        buildTOC();
      }

      init();
    </script>

    <script src="nav.js"></script>
  </body>
</html>
